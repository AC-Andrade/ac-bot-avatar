name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Quality checks and package smoke tests
        run: yarn quality

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual gallery regression
        run: yarn test:visual
        env:
          CI: "true"
