name: Publish packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify coordinated release version
        run: node scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Quality checks and tarball validation
        run: yarn quality

      - name: Audit runtime dependencies
        run: yarn security:audit

      - name: Snyk Open Source dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::Snyk is not authenticated. Configure SNYK_TOKEN or run 'snyk auth' locally."
            exit 1
          fi
          yarn security:snyk

      - name: Snyk Code (optional)
        if: ${{ vars.SNYK_CODE_ENABLED == 'true' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: yarn security:snyk:code

      - name: Snyk Code status
        if: ${{ vars.SNYK_CODE_ENABLED != 'true' }}
        run: echo "Snyk Code is disabled. Set SNYK_CODE_ENABLED=true when the organization plan supports it."

      - name: Publish core
        run: npm publish --access public --provenance
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish utils
        run: npm publish --access public --provenance
        working-directory: packages/utils
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish assets
        run: npm publish --access public --provenance
        working-directory: packages/assets
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish React
        run: npm publish --access public --provenance
        working-directory: packages/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
